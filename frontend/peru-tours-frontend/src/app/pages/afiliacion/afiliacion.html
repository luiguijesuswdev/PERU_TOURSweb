<section class="page">
  <div class="card">
    <div class="info">
      <p class="tag">Nuevo socio</p>
      <h1>Afíliate a Perú TOURS</h1>
      <p>
        Registra tus datos para acceder a solicitudes de paquetes turísticos,
        cotizaciones personalizadas y seguimiento digital de tus viajes.
      </p>
    </div>

    <form (ngSubmit)="registrarCliente()">
      <div class="grid">
        <div class="campo">
          <label>Nombres</label>
          <input
            type="text"
            name="nombres"
            [(ngModel)]="cliente.nombres"
            placeholder="Ingrese sus nombres"
            required
          >
        </div>

        <div class="campo">
          <label>Apellidos</label>
          <input
            type="text"
            name="apellidos"
            [(ngModel)]="cliente.apellidos"
            placeholder="Ingrese sus apellidos"
            required
          >
        </div>
      </div>

      <div class="campo">
        <label>Correo electrónico</label>
        <input
          type="email"
          name="correo"
          [(ngModel)]="cliente.correo"
          placeholder="correo@ejemplo.com"
          required
        >
      </div>

      <div class="campo">
        <label>Teléfono</label>
        <input
          type="text"
          name="telefono"
          [(ngModel)]="cliente.telefono"
          placeholder="999 999 999"
          required
        >
      </div>

      <div class="campo">
        <label>Ciudad</label>
        <input
          type="text"
          name="ciudad"
          [(ngModel)]="cliente.ciudad"
          placeholder="Ejemplo: Lima"
          required
        >
      </div>

      <button type="submit">Registrar afiliación</button>

      @if (mensaje) {<p class="mensaje">{{ mensaje }}</p>}

      <a href="/" class="volver">← Volver al inicio</a>
    </form>
  </div>
</section>
