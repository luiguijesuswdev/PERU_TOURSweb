<section class="page">
  <div class="card">
    <div class="info">
      <p class="tag">Nuevo socio</p>
      <h1>Afíliate a Perú TOURS</h1>
      <p>
        Registra tus datos para acceder a solicitudes de paquetes turísticos,
        cotizaciones personalizadas y seguimiento digital de tus viajes.
      </p>
    </div>

    <form>
      <div class="grid">
        <div class="campo">
          <label>Nombres</label>
          <input type="text" placeholder="Ingrese sus nombres">
        </div>

        <div class="campo">
          <label>Apellidos</label>
          <input type="text" placeholder="Ingrese sus apellidos">
        </div>
      </div>

      <div class="campo">
        <label>Correo electrónico</label>
        <input type="email" placeholder="correo@ejemplo.com">
      </div>

      <div class="campo">
        <label>Teléfono</label>
        <input type="text" placeholder="999 999 999">
      </div>

      <div class="campo">
        <label>Ciudad</label>
        <input type="text" placeholder="Ejemplo: Lima">
      </div>

      <button type="submit">Registrar afiliación</button>

      <a href="/" class="volver">← Volver al inicio</a>
    </form>
  </div>
</section>
