<div class="container">
  <h1>Solicitud de Paquete Turístico</h1>

  <form>
    <div class="campo">
      <label>Destino</label>
      <input type="text" placeholder="Ejemplo: Ica, Nazca, Paracas">
    </div>

    <div class="campo">
      <label>Número de personas</label>
      <input type="number">
    </div>

    <div class="campo">
      <label>Ciudad de partida</label>
      <input type="text" placeholder="Ejemplo: Lima">
    </div>

    <div class="grid">
      <div class="campo">
        <label>Fecha de salida</label>
        <input type="date">
      </div>

      <div class="campo">
        <label>Hora de salida</label>
        <input type="time">
      </div>
    </div>

    <div class="grid">
      <div class="campo">
        <label>Fecha de regreso</label>
        <input type="date">
      </div>

      <div class="campo">
        <label>Hora de regreso</label>
        <input type="time">
      </div>
    </div>

    <button type="submit">Registrar solicitud</button>
  </form>
</div>
